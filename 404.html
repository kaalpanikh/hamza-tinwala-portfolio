<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lost in space</title>
<meta http-equiv="refresh" content="4;url=./">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--void:#06050c;--gold:#ffd84a;--ink:#dcd3ee}
html,body{margin:0;height:100%;overflow-x:clip;background:var(--void);color:var(--ink);font-family:'Barlow',system-ui,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
h1{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(40px,8vw,88px);color:var(--gold);line-height:1.05;text-wrap:balance}
p{margin:0;font-size:18px}
a{color:var(--gold);text-underline-offset:4px}
a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<main>
<h1>This page drifted out of the galaxy</h1>
<p>Taking you back to the portfolio. <a href="./">Go now</a></p>
</main>
</body>
</html>
